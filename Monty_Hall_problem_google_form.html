<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蒙提霍爾問題 · 課堂實驗</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:rgba(148,163,184,.32);
    --accent:#38bdf8; --good:#34d399; --bad:#fb7185; --text:#e2e8f0; --muted:#94a3b8;
    --purple:#c084fc;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;padding:24px 16px calc(32px + env(safe-area-inset-bottom));
    min-height:100%;
    font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--text);
    background:radial-gradient(1100px 520px at 50% -8%, #1d3a5c 0%, #0f172a 62%) fixed;
    display:flex;flex-direction:column;align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-size:1.3rem;margin:6px 0 6px;letter-spacing:.02em}
  .hint{
    color:var(--muted);font-size:.86rem;text-align:center;
    min-height:1.4em;margin:0 0 20px;line-height:1.5;max-width:22em;
  }

  /* ── 門 ── */
  .doors{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
  .door{
    position:relative;
    width:clamp(74px,24vw,98px);
    height:clamp(104px,33vw,132px);
    border-radius:16px;
    border:2px solid var(--line);
    background:linear-gradient(180deg,#3b4a60 0%,#22303f 100%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.9rem,8vw,2.4rem);
    cursor:pointer;transition:transform .15s, border-color .2s, box-shadow .2s, background .25s;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    padding:0;
  }
  .door:disabled{cursor:default}
  .door:not(:disabled):active{transform:scale(.96)}
  .door.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.28),0 6px 18px rgba(0,0,0,.35)}
  .door.open{background:linear-gradient(180deg,#2a2f3a,#1a1e26);border-color:rgba(148,163,184,.2)}
  .door.prize{border-color:var(--good);box-shadow:0 0 0 3px rgba(52,211,153,.25)}
  .door .num{
    position:absolute;bottom:6px;left:0;right:0;
    font-size:.68rem;color:var(--muted);letter-spacing:.08em;
  }
  .door .badge{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#062a3d;font-size:.6rem;font-weight:800;
    padding:2px 7px;border-radius:99px;white-space:nowrap;
  }
  .door.prize .badge{background:var(--good);color:#053024}

  /* ── 按鈕 ── */
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:48px;margin-bottom:14px}
  .btn{
    padding:13px 22px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);
    font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;
    transition:transform .12s, filter .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:#062a3d;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08)}
  .btn.form{background:#7c3aed;color:#fff;border-color:transparent;text-decoration:none;display:inline-block}
  .btn.form:hover{filter:brightness(1.1)}

  /* ── 結果 ── */
  .result{
    font-size:1.05rem;font-weight:800;min-height:1.6em;
    opacity:0;transition:opacity .25s;text-align:center;
  }
  .result.show{opacity:1}
  .result.win{color:var(--good)}
  .result.lose{color:var(--bad)}
  .result .note{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:6px}

  /* ── 累計統計表 ── */
  .tally{
    width:100%;max-width:420px;margin-top:24px;
    background:rgba(30,41,59,.72);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;backdrop-filter:blur(6px);
  }
  .tally h2{
    font-size:.78rem;font-weight:700;color:var(--muted);
    letter-spacing:.08em;margin:0 0 10px;text-transform:uppercase;
  }
  .tally table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
  .tally th,.tally td{
    padding:7px 4px;text-align:center;font-size:.88rem;
    border-bottom:1px solid rgba(148,163,184,.14);
  }
  .tally th{color:var(--muted);font-weight:600;font-size:.72rem;letter-spacing:.04em}
  .tally td:first-child,.tally th:first-child{text-align:left;padding-left:2px}
  .tally .row-stay td:first-child{color:var(--purple)}
  .tally .row-switch td:first-child{color:var(--accent)}
  .tally .num{font-weight:700;font-size:1rem}
  .tally .rate{color:var(--muted);font-size:.82rem}

  .form-block{
    width:100%;max-width:420px;margin-top:22px;text-align:center;
  }
  .form-block .tip{font-size:.78rem;color:var(--muted);margin:0 0 12px;line-height:1.6}
  .footnote{margin-top:18px;font-size:.72rem;color:var(--muted);text-align:center;max-width:22em;line-height:1.6}
</style>
</head>
<body>

  <h1>🚪 蒙提霍爾問題</h1>
  <p class="hint" id="hint">選一扇門，看看你的運氣</p>

  <div class="doors" id="doors"></div>
  <div class="actions" id="actions"></div>
  <div class="result" id="result"></div>

  <!-- 累計統計 -->
  <div class="tally">
    <h2>你的累計戰績</h2>
    <table>
      <thead>
        <tr>
          <th>策略</th>
          <th>總次數</th>
          <th>中獎次數</th>
          <th>中獎率</th>
        </tr>
      </thead>
      <tbody>
        <tr class="row-stay">
          <td>不換門</td>
          <td class="num" id="stayTotal">0</td>
          <td class="num" id="stayWins">0</td>
          <td class="rate" id="stayRate">–</td>
        </tr>
        <tr class="row-switch">
          <td>換門</td>
          <td class="num" id="switchTotal">0</td>
          <td class="num" id="switchWins">0</td>
          <td class="rate" id="switchRate">–</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- 填寫表單區 -->
  <div class="form-block">
    <p class="tip">玩到你想停為止，再按下面按鈕，把這四個數字填進 Google Form。</p>
    <a class="btn form" id="formLink" target="_blank" rel="noopener">📝 填寫我的結果</a>
  </div>

  <p class="footnote">
    老師會從 Google Form 的回應試算表中，加總全班的數字並計算中獎率。
  </p>

<script>
(() => {
  'use strict';

  /* ============================================================
     1. 請換成你的 Google Form 連結
     2. 若你的表單欄位有啟用「預填答案」，可把產生的
        entry.XXXXXX=值 參數接在網址後面（見下方說明）
     ============================================================ */
  const GOOGLE_FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSdNm9YqRddk5QR8hBWSvgq-B7t-PxPqxsIu5Plreonv7wZTDg/viewform';

  /* 若你的表單有四個數字欄位，可填入它們的 entry ID，
     程式會自動把四個數字預填進表單，學生只要按送出。
     若不想用預填，保持 null 即可。 */
  const FORM_ENTRIES = {
    stayTotal:  'entry.356614307',  // 例如 'entry.111111'
    stayWins:   'entry.24877496',  // 例如 'entry.222222'
    switchTotal: 'entry.631144117',  // 例如 'entry.333333'
    switchWins:   'entry.2112324108', // 例如 'entry.444444'
  };

  /* ---------- DOM ---------- */
  const doorsEl    = document.getElementById('doors');
  const actionsEl  = document.getElementById('actions');
  const resultEl   = document.getElementById('result');
  const hintEl     = document.getElementById('hint');
  const formLink   = document.getElementById('formLink');

  const els = {
    stayTotal:  document.getElementById('stayTotal'),
    stayWins:   document.getElementById('stayWins'),
    stayRate:   document.getElementById('stayRate'),
    switchTotal:document.getElementById('switchTotal'),
    switchWins: document.getElementById('switchWins'),
    switchRate: document.getElementById('switchRate')
  };

  /* ---------- 累計數據 ---------- */
  const tally = {
    stay:   { total: 0, wins: 0 },
    switch: { total: 0, wins: 0 }
  };

  /* ---------- 遊戲狀態 ---------- */
  let prize, pick, opened, finalPick, phase;
  const other = (a, b) => [0, 1, 2].find(d => d !== a && d !== b);

  /* ---------- 新的一局 ---------- */
  function newGame() {
    prize = Math.floor(Math.random() * 3);
    pick = opened = finalPick = null;
    phase = 'pick';

    resultEl.className = 'result';
    resultEl.textContent = '';
    hintEl.textContent = '選一扇門，看看你的運氣';

    renderDoors();
    renderActions();
  }

  /* ---------- 玩家選門 ---------- */
  function onPick(i) {
    if (phase !== 'pick') return;

    pick = i;

    // 主持人打開一扇有山羊的門（不是玩家選的、也不是大獎）
    const candidates = [0, 1, 2].filter(d => d !== pick && d !== prize);
    opened = candidates[Math.floor(Math.random() * candidates.length)];

    phase = 'decide';
    hintEl.textContent = '主持人打開了一扇有山羊的門。你要換門嗎？';
    renderDoors();
    renderActions();
  }

  /* ---------- 玩家決定換 / 不換 ---------- */
  function finish(switched) {
    if (phase !== 'decide') return;

    finalPick = switched ? other(pick, opened) : pick;
    const won = (finalPick === prize);

    // 累加到對應策略
    const bucket = switched ? tally.switch : tally.stay;
    bucket.total++;
    if (won) bucket.wins++;

    updateTallyDisplay();

    phase = 'reveal';
    hintEl.textContent = '';
    renderDoors();
    renderActions();

    resultEl.className = 'result show ' + (won ? 'win' : 'lose');
    resultEl.innerHTML =
      (won ? '🎉 恭喜中獎！' : '😢 這次是山羊…') +
      '<span class="note">你選擇了「' + (switched ? '換門' : '不換門') +
      '」 · 可以按「再玩一次」繼續累計</span>';
  }

  /* ---------- 更新累計統計顯示 ---------- */
  function updateTallyDisplay() {
    const s = tally.stay, w = tally.switch;

    els.stayTotal.textContent  = s.total;
    els.stayWins.textContent   = s.wins;
    els.stayRate.textContent   = s.total ? (s.wins / s.total * 100).toFixed(0) + '%' : '–';

    els.switchTotal.textContent = w.total;
    els.switchWins.textContent  = w.wins;
    els.switchRate.textContent  = w.total ? (w.wins / w.total * 100).toFixed(0) + '%' : '–';

    updateFormLink();
  }

  /* ---------- 更新表單連結（可預填四個數字） ---------- */
  function updateFormLink() {
    const params = new URLSearchParams();

    if (FORM_ENTRIES.stayTotal)   params.set(FORM_ENTRIES.stayTotal,   tally.stay.total);
    if (FORM_ENTRIES.stayWins)    params.set(FORM_ENTRIES.stayWins,    tally.stay.wins);
    if (FORM_ENTRIES.switchTotal) params.set(FORM_ENTRIES.switchTotal, tally.switch.total);
    if (FORM_ENTRIES.switchWins)  params.set(FORM_ENTRIES.switchWins,  tally.switch.wins);

    const qs = params.toString();
    formLink.href = qs ? GOOGLE_FORM_URL + '?' + qs : GOOGLE_FORM_URL;
  }

  /* ---------- 畫面渲染 ---------- */
  function renderDoors() {
    doorsEl.innerHTML = '';

    for (let i = 0; i < 3; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';

      let cls = 'door';
      let icon = '🚪';
      let badge = '';

      if (phase === 'decide') {
        if (i === pick)        { cls += ' selected'; badge = '你選的'; }
        else if (i === opened) { cls += ' open';     icon = '🐐'; }
      } else if (phase === 'reveal') {
        if (i === prize)       { cls += ' open prize'; icon = '🚗'; }
        else                   { cls += ' open';       icon = '🐐'; }
        if (i === finalPick)   { badge = (i === prize) ? '中大獎' : '你的最終選擇'; }
      }

      btn.className = cls;
      btn.disabled = (phase !== 'pick');
      btn.setAttribute('aria-label', (i + 1) + ' 號門');
      btn.innerHTML =
        (badge ? '<span class="badge">' + badge + '</span>' : '') +
        '<span class="icon">' + icon + '</span>' +
        '<span class="num">' + (i + 1) + '</span>';

      btn.addEventListener('click', () => onPick(i));
      doorsEl.appendChild(btn);
    }
  }

  function renderActions() {
    actionsEl.innerHTML = '';

    if (phase === 'decide') {
      const target = other(pick, opened);

      const swap = document.createElement('button');
      swap.className = 'btn primary';
      swap.textContent = '換到 ' + (target + 1) + ' 號門';
      swap.addEventListener('click', () => finish(true));

      const stay = document.createElement('button');
      stay.className = 'btn';
      stay.textContent = '不換，堅持 ' + (pick + 1) + ' 號門';
      stay.addEventListener('click', () => finish(false));

      actionsEl.append(swap, stay);
    } else if (phase === 'reveal') {
      const again = document.createElement('button');
      again.className = 'btn primary';
      again.textContent = '再玩一次';
      again.addEventListener('click', newGame);
      actionsEl.appendChild(again);
    }
  }

  /* ---------- 啟動 ---------- */
  newGame();
  updateTallyDisplay();
})();
</script>
</body>
</html>
