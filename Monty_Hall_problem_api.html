<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>蒙提霍爾問題 · 一起玩</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --line:rgba(148,163,184,.32);
    --accent:#38bdf8; --good:#34d399; --bad:#fb7185; --text:#e2e8f0; --muted:#94a3b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;padding:24px 16px calc(32px + env(safe-area-inset-bottom));
    min-height:100%;
    font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    color:var(--text);
    background:radial-gradient(1100px 520px at 50% -8%, #1d3a5c 0%, #0f172a 62%) fixed;
    display:flex;flex-direction:column;align-items:center;
    -webkit-font-smoothing:antialiased;
  }
  h1{font-size:1.3rem;margin:6px 0 6px;letter-spacing:.02em}
  .hint{
    color:var(--muted);font-size:.86rem;text-align:center;
    min-height:1.4em;margin:0 0 20px;line-height:1.5;max-width:22em;
  }

  /* ── 門 ── */
  .doors{display:flex;gap:12px;justify-content:center;margin-bottom:22px}
  .door{
    position:relative;
    width:clamp(74px,24vw,98px);
    height:clamp(104px,33vw,132px);
    border-radius:16px;
    border:2px solid var(--line);
    background:linear-gradient(180deg,#3b4a60 0%,#22303f 100%);
    color:var(--text);
    display:flex;align-items:center;justify-content:center;
    font-size:clamp(1.9rem,8vw,2.4rem);
    cursor:pointer;transition:transform .15s, border-color .2s, box-shadow .2s, background .25s;
    box-shadow:0 6px 18px rgba(0,0,0,.35);
    padding:0;
  }
  .door:disabled{cursor:default}
  .door:not(:disabled):active{transform:scale(.96)}
  .door.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(56,189,248,.28),0 6px 18px rgba(0,0,0,.35)}
  .door.open{background:linear-gradient(180deg,#2a2f3a,#1a1e26);border-color:rgba(148,163,184,.2)}
  .door.prize{border-color:var(--good);box-shadow:0 0 0 3px rgba(52,211,153,.25)}
  .door .num{
    position:absolute;bottom:6px;left:0;right:0;
    font-size:.68rem;color:var(--muted);letter-spacing:.08em;
  }
  .door .badge{
    position:absolute;top:-9px;left:50%;transform:translateX(-50%);
    background:var(--accent);color:#062a3d;font-size:.6rem;font-weight:800;
    padding:2px 7px;border-radius:99px;white-space:nowrap;
  }
  .door.prize .badge{background:var(--good);color:#053024}

  /* ── 按鈕 ── */
  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:48px;margin-bottom:14px}
  .btn{
    padding:13px 22px;border-radius:12px;border:1px solid var(--line);
    background:var(--panel);color:var(--text);
    font-size:.95rem;font-weight:700;font-family:inherit;cursor:pointer;
    transition:transform .12s, filter .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn.primary{background:var(--accent);color:#062a3d;border-color:transparent}
  .btn.primary:hover{filter:brightness(1.08)}

  /* ── 結果 ── */
  .result{
    font-size:1.05rem;font-weight:800;min-height:1.6em;
    opacity:0;transition:opacity .25s;
  }
  .result.show{opacity:1}
  .result.win{color:var(--good)}
  .result.lose{color:var(--bad)}
  .result .note{display:block;font-size:.72rem;font-weight:500;color:var(--muted);margin-top:6px}

  /* ── 統計 ── */
  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;
    width:100%;max-width:420px;margin-top:26px;
  }
  .card{
    background:rgba(30,41,59,.72);border:1px solid var(--line);
    border-radius:14px;padding:12px 14px;backdrop-filter:blur(6px);
  }
  .card .label{font-size:.72rem;color:var(--muted);letter-spacing:.06em}
  .card .rate{font-size:1.5rem;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .card.stay .rate{color:#c084fc}
  .card.switch .rate{color:var(--accent)}
  .card .detail{font-size:.7rem;color:var(--muted);font-variant-numeric:tabular-nums}
  .footnote{margin-top:14px;font-size:.7rem;color:var(--muted)}
</style>
</head>
<body>

  <h1>🚪 蒙提霍爾問題</h1>
  <p class="hint" id="hint">選一扇門，看看你的運氣</p>

  <div class="doors" id="doors"></div>
  <div class="actions" id="actions"></div>
  <div class="result" id="result"></div>

  <div class="stats">
    <div class="card stay">
      <div class="label">不換門</div>
      <div class="rate" id="stayRate">–</div>
      <div class="detail" id="stayDetail">0 / 0 次中獎</div>
    </div>
    <div class="card switch">
      <div class="label">換門</div>
      <div class="rate" id="switchRate">–</div>
      <div class="detail" id="switchDetail">0 / 0 次中獎</div>
    </div>
  </div>
  <p class="footnote" id="footnote">全班統計載入中…</p>

<script>
(() => {
  'use strict';

  /* ---------- 裝置 ID（只用來數「幾台裝置參與」，不含個資） ---------- */
  const deviceId = (() => {
    let id = null;
    try { id = localStorage.getItem('monty_device'); } catch (e) {}
    if (!id) {
      id = 'd_' + Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
      try { localStorage.setItem('monty_device', id); } catch (e) {}
    }
    return id;
  })();

  /* ---------- DOM ---------- */
  const doorsEl    = document.getElementById('doors');
  const actionsEl  = document.getElementById('actions');
  const resultEl   = document.getElementById('result');
  const hintEl     = document.getElementById('hint');
  const footnoteEl = document.getElementById('footnote');

  /* ---------- 遊戲狀態 ---------- */
  let prize, pick, opened, finalPick, phase;
  // phase: 'pick' → 'decide' → 'reveal'

  const other = (a, b) => [0, 1, 2].find(d => d !== a && d !== b);

  /* ---------- 開始新的一局 ---------- */
  function newGame() {
    prize = Math.floor(Math.random() * 3);
    pick = opened = finalPick = null;
    phase = 'pick';

    resultEl.className = 'result';
    resultEl.textContent = '';
    hintEl.textContent = '選一扇門，看看你的運氣';

    renderDoors();
    renderActions();
  }

  /* ---------- 玩家選門 ---------- */
  function onPick(i) {
    if (phase !== 'pick') return;

    pick = i;

    // 主持人打開一扇「不是玩家選的、也不是大獎」的門
    const candidates = [0, 1, 2].filter(d => d !== pick && d !== prize);
    opened = candidates[Math.floor(Math.random() * candidates.length)];

    phase = 'decide';
    hintEl.textContent = '主持人打開了一扇有山羊的門。你要換門嗎？';
    renderDoors();
    renderActions();
  }

  /* ---------- 玩家決定換 / 不換 ---------- */
  async function finish(switched) {
    if (phase !== 'decide') return;

    finalPick = switched ? other(pick, opened) : pick;
    const won = (finalPick === prize);

    phase = 'reveal';
    hintEl.textContent = '';
    renderDoors();
    renderActions();

    resultEl.className = 'result show ' + (won ? 'win' : 'lose');
    resultEl.innerHTML = (won ? '🎉 恭喜中獎！' : '😢 這次是山羊…') +
      '<span class="note">你選擇了「' + (switched ? '換門' : '不換門') + '」</span>';

    // 送到伺服器統計
    try {
      const res = await fetch('/api/result', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ switched, won, deviceId })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      paint(data.stats);
    } catch (err) {
      // 離線時仍在本機累加，至少讓學生看到自己的結果
      bumpLocal(switched, won);
      footnoteEl.textContent = '⚠️ 目前離線，這局未計入全班統計';
    }
  }

  /* ---------- 畫面渲染 ---------- */
  function renderDoors() {
    doorsEl.innerHTML = '';

    for (let i = 0; i < 3; i++) {
      const btn = document.createElement('button');
      btn.type = 'button';

      let cls = 'door';
      let icon = '🚪';
      let badge = '';

      if (phase === 'decide') {
        if (i === pick)           { cls += ' selected'; badge = '你選的'; }
        else if (i === opened)    { cls += ' open';     icon = '🐐'; }
      } else if (phase === 'reveal') {
        if (i === prize)          { cls += ' open prize'; icon = '🚗'; }
        else                      { cls += ' open';       icon = '🐐'; }
        if (i === finalPick)      { badge = (i === prize) ? '中大獎' : '你的最終選擇'; }
      }

      btn.className = cls;
      btn.disabled = (phase !== 'pick');
      btn.setAttribute('aria-label', (i + 1) + ' 號門');
      btn.innerHTML =
        (badge ? '<span class="badge">' + badge + '</span>' : '') +
        '<span class="icon">' + icon + '</span>' +
        '<span class="num">' + (i + 1) + '</span>';

      btn.addEventListener('click', () => onPick(i));
      doorsEl.appendChild(btn);
    }
  }

  function renderActions() {
    actionsEl.innerHTML = '';

    if (phase === 'decide') {
      const target = other(pick, opened);

      const swap = document.createElement('button');
      swap.className = 'btn primary';
      swap.textContent = '換到 ' + (target + 1) + ' 號門';
      swap.addEventListener('click', () => finish(true));

      const stay = document.createElement('button');
      stay.className = 'btn';
      stay.textContent = '不換，堅持 ' + (pick + 1) + ' 號門';
      stay.addEventListener('click', () => finish(false));

      actionsEl.append(swap, stay);
    } else if (phase === 'reveal') {
      const again = document.createElement('button');
      again.className = 'btn primary';
      again.textContent = '再玩一次';
      again.addEventListener('click', newGame);
      actionsEl.appendChild(again);
    }
  }

  /* ---------- 統計顯示 ---------- */
  let lastStats = { stay: { total: 0, wins: 0 }, switch: { total: 0, wins: 0 }, total: 0, devices: 0 };

  function paint(st) {
    if (!st) return;
    lastStats = st;

    const s = st.stay, w = st.switch;

    document.getElementById('stayRate').textContent =
      s.total ? (s.wins / s.total * 100).toFixed(1) + '%' : '–';
    document.getElementById('stayDetail').textContent =
      s.wins + ' / ' + s.total + ' 次中獎';

    document.getElementById('switchRate').textContent =
      w.total ? (w.wins / w.total * 100).toFixed(1) + '%' : '–';
    document.getElementById('switchDetail').textContent =
      w.wins + ' / ' + w.total + ' 次中獎';

    footnoteEl.textContent =
      '全班已玩 ' + (st.total || 0) + ' 局 · ' + (st.devices || 0) + ' 台裝置參與';
  }

  function bumpLocal(switched, won) {
    const b = switched ? lastStats.switch : lastStats.stay;
    b.total++; if (won) b.wins++;
    lastStats.total = (lastStats.total || 0) + 1;
    paint(lastStats);
  }

  async function loadStats() {
    try {
      const res = await fetch('/api/stats', { cache: 'no-store' });
      paint(await res.json());
    } catch (e) {
      footnoteEl.textContent = '⚠️ 無法連線到統計伺服器';
    }
  }

  /* ---------- 啟動 ---------- */
  newGame();
  loadStats();

  // 每 15 秒同步一次全班數字
  setInterval(loadStats, 15000);
})();
</script>
</body>
</html>
